# Nginx reverse proxy for the Docker frontend and backend services.
# The frontend container serves the Vite build at /index.html.
server {
    listen 80;
    server_name erp.speshway.site;

    # API requests go to Express; do not strip the /api prefix.
    location /api {
        proxy_pass http://erp-backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Keep websocket upgrades working for Socket.IO.
    location /socket.io/ {
        proxy_pass http://erp-backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }

    # React Router routes must receive the SPA entry point on direct visits
    # and refreshes, rather than asking the frontend server for a real file.
    location = /admin {
        proxy_pass http://erp-frontend:80/index.html;
        proxy_set_header Host $host;
    }

    location ^~ /admin/ {
        proxy_pass http://erp-frontend:80/index.html;
        proxy_set_header Host $host;
    }

    # Other frontend routes and static assets.
    location / {
        proxy_pass http://erp-frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
