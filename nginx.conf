# ==============================================================================
# Nginx Server Configuration for Speshway All-In-One ERP
# Domain: erp.speshway.site
# Purpose: Resolves 404 Not Found on /admin and other React Router SPA routes
# ==============================================================================

# HTTP Configuration
server {
    listen 80;
    listen [::]:80;
    server_name erp.speshway.site;

    # Root directory pointing to the built React Vite assets
    # (Update this path to your server's project location)
    root /var/www/Speshway-All-In-One-ERP/client/dist;
    index index.html index.htm;

    # --------------------------------------------------------------------------
    # 1. FRONTEND SPA ROUTING (FIXES THE 404 NOT FOUND ON /admin)
    # Checks for the exact file, then directory, then falls back to /index.html
    # so React Router handles /admin, /pricing, /projects, etc.
    # --------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --------------------------------------------------------------------------
    # 2. BACKEND API REVERSE PROXY
    # Forwards /api/* requests to the Node.js Express server running on port 5000
    # --------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # --------------------------------------------------------------------------
    # 3. WEBSOCKET REAL-TIME SYNC PROXY
    # Forwards /socket.io/* to the Socket.io WebSocket engine on port 5000
    # --------------------------------------------------------------------------
    location /socket.io/ {
        proxy_pass http://127.0.0.1:5000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --------------------------------------------------------------------------
    # 4. STATIC ASSET CACHING
    # --------------------------------------------------------------------------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }
}

